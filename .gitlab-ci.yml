# ==============================================================================
# File: .gitlab-ci.yml
# ==============================================================================
stages:
  - build
  - test
  - security
  - deploy

build_core:
  stage: build
  script:
    - echo "Building core module..."

build_assets:
  stage: build
  script:
    - echo "Building UI assets..."

test_unit:
  stage: test
  needs: ["build_core"]
  script:
    - echo "Running unit tests..."

test_integration:
  stage: test
  needs: ["build_core", "build_assets"]
  script:
    - echo "Running integration tests..."

test_e2e:
  stage: test
  needs: ["build_assets"]
  script:
    - echo "Running E2E tests..."

security_sast:
  stage: security
  needs: ["test_unit"]
  script:
    - echo "Running SAST scanner..."

security_dast:
  stage: security
  needs: ["test_integration"]
  script:
    - echo "Running DAST scanner..."

security_deps:
  stage: security
  needs: ["test_e2e"]
  script:
    - echo "Running dependency check..."

deploy_staging:
  stage: deploy
  needs: ["security_sast", "security_dast"]
  script:
    - echo "Deploying to staging..."

deploy_production:
  stage: deploy
  needs: ["deploy_staging", "security_deps"]
  script:
    - echo "Deploying to production..."
